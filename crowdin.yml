# ─────────────────────────────────────────────────────────────────────────────
# Crowdin CLI — Budgetty (Android)
# Project:  https://crowdin.com/project/budgetty        (shared with the iOS repo)
# CLI:      https://crowdin.github.io/crowdin-cli/
#           install:  brew install crowdin   (or  npm i -g @crowdin/cli)
#
# Credentials come from the environment — do NOT hardcode tokens in this file:
#   export CROWDIN_PROJECT_ID=<Project → Settings → the numeric Project ID>
#   export CROWDIN_PERSONAL_TOKEN=<crowdin.com → Account Settings → API →
#                                  New Token, with this project in scope>
#
# Typical workflow:
#   crowdin push                                        # upload the English source
#   crowdin upload translations --auto-approve-imported # import the 15 already-done
#                                                       #   locales so Crowdin marks them
#                                                       #   done — only Hungarian is left
#   crowdin download                                    # pull translations back into
#                                                       #   values-<code>/strings.xml
# ─────────────────────────────────────────────────────────────────────────────

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

base_path: "."
preserve_hierarchy: true

files:
  - source: /app/src/main/res/values/strings.xml
    # %android_code% resolves to the values-<code> qualifier (bg, de, hu, …).
    translation: /app/src/main/res/values-%android_code%/%original_file_name%

    # Safety net: pin the region-suffixed Crowdin languages to the bare folder
    # Budgetty actually ships, so they never land in values-es-rES / values-pt-rPT.
    # Harmless if a language's ID differs (it just falls back to %android_code%).
    # Confirm with one `crowdin download` and eyeball the folders that appear.
    languages_mapping:
      android_code:
        es-ES: es
        pt-PT: pt
        sv-SE: sv
        nb: nb        # Norwegian Bokmål → values-nb. In Crowdin you MUST have
                      # selected "Norwegian Bokmål", not the generic "Norwegian".

    # Crowdin auto-detects the Android XML type (honours translatable="false"
    # and <plurals>). If a push ever mis-parses it, force it with:  type: android
